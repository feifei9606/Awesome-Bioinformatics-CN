---
###########################
## Markdown Linter rules ##
###########################

# 为什么这个文件放在 .github/linters/ 而不是仓库根目录：
#   super-linter 只从 LINTER_RULES_PATH（默认 .github/linters）读取 linter 配置，
#   并且用的是它自己约定的文件名（v3.17.1 = .markdown-lint.yml）。
#   仓库根目录的 .markdownlint.json 会被忽略（super-linter issue #5101）。
#   .markdownlint.json 保留下来给本地 markdownlint / 编辑器用。
#
# 本文件内容 = super-linter v3.17.1 的默认模板（TEMPLATES/.markdown-lint.yml），
# 唯一改动：MD013 由 `line_length: 400` 改为 false（与根目录 .markdownlint.json 的
# `line-length: false` 意图一致）。README 的条目天然是"单行长链接"，
# 徽章行就有 586 字符，限制行宽没有意义。
#
# 注意：super-linter 用本文件**整体替换**默认模板，所以模板里其余被关闭的规则
# （MD004/MD026/MD029/MD033/MD036/blank_lines）必须原样保留，
# 否则它们会被重新启用并可能引入新的报错。

###############
# Rules by id #
###############
MD004: false                  # Unordered list style
MD007:
  indent: 2                   # Unordered list indentation
MD013: false                  # Line length
MD026:
  punctuation: ".,;:!。，；:"  # List of not allowed
MD029: false                  # Ordered list item prefix
MD033: false                  # Allow inline HTML
MD036: false                  # Emphasis used instead of a heading

#################
# Rules by tags #
#################
blank_lines: false  # Error on blank lines
