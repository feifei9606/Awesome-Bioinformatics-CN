---
###########################
## Markdown Linter rules ##
###########################

# 为什么这份配置放在 .github/linters/，而不是仓库根目录：
#   super-linter 只从 LINTER_RULES_PATH（默认 .github/linters）读取 linter 配置，
#   且用的是它自己约定的文件名（各版本均为 .markdown-lint.yml）。
#   仓库根目录的 .markdownlint.json 不会被读取（见 super-linter issue #5101）；
#   那份保留给本地 markdownlint / 编辑器使用。
#
#   另外，提供了自己的配置后，super-linter 会**整体忽略**其内置默认模板，
#   所以下面必须把模板里的规则原样保留，只改需要改的那一条。
#   否则被模板关闭的规则（MD004/MD026/MD029/MD033/MD036/blank_lines）
#   会被重新启用，可能引入新的报错。
#
# 与原模板（super-linter v9.0.0 TEMPLATES/.markdown-lint.yml）的唯一差异：
#   MD013 由 `line_length: 400` 改为 false，与根目录 .markdownlint.json 的
#   `line-length: false` 意图一致。本仓库的条目天然是「单行长链接」，
#   仅第 1 行的徽章行就有 586 字符，限制行宽没有意义。

###############
# Rules by id #
###############
MD004: false # Unordered list style
MD007:
  indent: 2 # Unordered list indentation
MD013: false # Line length
MD026:
  punctuation: ".,;:!。，；:" # List of not allowed
MD029: false # Ordered list item prefix
MD033: false # Allow inline HTML
MD036: false # Emphasis used instead of a heading

#################
# Rules by tags #
#################
blank_lines: false # Error on blank lines
