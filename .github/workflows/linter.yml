name: 🧹 Lint Code Base
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  build:
    name: Lint Code Base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Lint Code Base
        uses: github/super-linter@v3
        env:
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_MARKDOWN: true
          # 显式指定规则目录：super-linter 只从这里读 linter 配置，
          # 不会读仓库根目录的 .markdownlint.json（见 .github/linters/.markdown-lint.yml 内注释）
          LINTER_RULES_PATH: .github/linters
