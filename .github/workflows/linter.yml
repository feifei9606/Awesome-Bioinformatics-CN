---
name: 🧹 Lint Code Base
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Lint Code Base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # super-linter 需要完整历史，才能算出「本次改了哪些文件」
          fetch-depth: 0

      - name: Lint Code Base
        # 原先用的是 github/super-linter@v3。该仓库已归档，v3 又是浮动短标签，
        # 它现在解析到的 ghcr.io/github/super-linter:v3.17.1 镜像并不完整：
        # 容器内缺 lib/functions/tapLibrary.sh 与 lib/functions/linterVersions.txt，
        # 导致 linter.sh 在运行任何 linter 之前就 FATAL 退出：
        #   [FATAL] Failed to view version file
        # 这才是该 step 长期失败的原因，与 README 内容无关。
        # 官方建议钉到完整语义化版本标签（短标签不保证不可变），故固定为 v9.0.0。
        uses: super-linter/super-linter@v9.0.0
        env:
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          # super-linter 只从 LINTER_RULES_PATH 读取 linter 配置（默认值即 .github/linters），
          # 仓库根目录的 .markdownlint.json 不会被读取（super-linter issue #5101）；
          # 根目录那份保留给本地 markdownlint / 编辑器使用。
          LINTER_RULES_PATH: .github/linters

          # 这里用「包含」模式：只显式开启需要的 linter，未列出的自动关闭
          # （见 super-linter 的 lib/functions/validation.sh）。
          # 注意：VALIDATE_* 只能全 true（只跑列出的）或全 false（只排除列出的），
          # 两者混用会直接 FATAL：
          #   [ERROR] Behavior not supported, please either only include (VALIDATE=true)
          #           or exclude (VALIDATE=false) linters, but not both
          # 所以下面**不要**再添加任何 `VALIDATE_*: false`。
          VALIDATE_MARKDOWN: true
